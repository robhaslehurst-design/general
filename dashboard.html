<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulting Firm — Financial Forecasting Dashboard</title>
<style>
:root{--blue:#2F5496;--blue-light:#D6E4F0;--blue-bg:#EDF2F9;--red:#C00000;--green:#548235;--orange:#ED7D31;--purple:#7030A0;--gray:#666;--border:#dde3ec;--bg:#f5f7fa;--white:#fff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:#222;font-size:13px}
header{background:var(--blue);color:#fff;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px}
header h1{font-size:17px;font-weight:600}
header .sub{font-size:11px;opacity:.7}
.hdr-btns{display:flex;gap:6px;align-items:center}
.hdr-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:5px 14px;border-radius:4px;cursor:pointer;font-size:11px}
.hdr-btn:hover{background:rgba(255,255,255,.25)}
.container{display:grid;grid-template-columns:310px 1fr;gap:0;min-height:calc(100vh - 50px)}
.sidebar{background:var(--white);border-right:1px solid var(--border);overflow-y:auto;max-height:calc(100vh - 50px)}
.sidebar h2{font-size:10px;text-transform:uppercase;letter-spacing:1.2px;color:var(--blue);padding:10px 14px 4px;background:var(--blue-light);font-weight:700;position:sticky;top:0;z-index:2}
.ig{padding:2px 14px;display:grid;grid-template-columns:1fr 84px;align-items:center;gap:2px;border-bottom:1px solid #f0f2f5}
.ig:hover{background:#f8fafd}
.ig label{font-size:11px;color:#444}
.ig input{width:100%;text-align:right;padding:2px 5px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:'SF Mono',Consolas,monospace}
.ig input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 2px rgba(47,84,150,.15)}
.ig .u{font-size:9px;color:var(--gray)}
.changed input{background:#FFF9E6!important;border-color:var(--orange)!important}
.main{padding:16px 20px;overflow-y:auto;max-height:calc(100vh - 50px)}

/* Scenario bar */
.scn-bar{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;align-items:center}
.scn-bar .lbl{font-size:11px;font-weight:600;color:var(--blue);margin-right:4px}
.scn-btn{padding:5px 14px;border-radius:4px;border:1px solid var(--border);background:var(--white);cursor:pointer;font-size:11px;font-weight:500;color:#444;transition:all .15s}
.scn-btn:hover{border-color:var(--blue);color:var(--blue)}
.scn-btn.active{background:var(--blue);color:#fff;border-color:var(--blue)}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:12px;border-bottom:2px solid var(--border)}
.tab{padding:6px 16px;cursor:pointer;font-size:12px;font-weight:500;color:var(--gray);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s;white-space:nowrap}
.tab:hover{color:var(--blue)}
.tab.active{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}

/* Tables */
.tw{overflow-x:auto;margin-bottom:18px}
table{border-collapse:collapse;width:100%;min-width:680px}
th{background:var(--blue);color:#fff;font-weight:600;font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:6px 10px;text-align:right;white-space:nowrap;position:sticky;top:0}
th:first-child{text-align:left;min-width:200px}
td{padding:3px 10px;text-align:right;border-bottom:1px solid #eef1f6;white-space:nowrap;font-family:'SF Mono',Consolas,monospace;font-size:11px}
td:first-child{text-align:left;font-family:'Segoe UI',system-ui,sans-serif;font-weight:400;color:#444}
tr:hover td{background:#f5f8fc}
.sr td{background:var(--blue-light)!important;font-weight:700!important;color:var(--blue)!important;font-family:'Segoe UI',system-ui,sans-serif!important;font-size:10px!important;text-transform:uppercase;letter-spacing:.5px;padding:5px 10px}
.st td{font-weight:600;border-top:1px solid var(--blue);border-bottom:2px solid var(--blue);color:var(--blue)}
.ind td:first-child{padding-left:22px;font-size:11px;color:#666}
.neg{color:var(--red)}
.hl td{background:#FFFDE7!important}

/* Charts */
.cg{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.cc{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:12px}
.cc h3{font-size:11px;color:var(--blue);margin-bottom:6px;font-weight:600}
.cc.wide{grid-column:1/-1}

/* KPIs */
.ks{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:8px 10px}
.kpi .kl{font-size:9px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray);margin-bottom:2px}
.kpi .kv{font-size:17px;font-weight:700;color:var(--blue);font-family:'SF Mono',Consolas,monospace}
.kpi .kd{font-size:10px;margin-top:1px}
.kpi .kd.up{color:var(--green)} .kpi .kd.dn{color:var(--red)}

.tc{display:none}.tc.active{display:block}

/* MC controls */
.mc-controls{background:var(--white);border:1px solid var(--border);border-radius:6px;padding:14px;margin-bottom:14px}
.mc-controls h3{font-size:12px;color:var(--blue);margin-bottom:10px;font-weight:600}
.mc-row{display:grid;grid-template-columns:180px 80px 80px 80px 80px;gap:6px;align-items:center;margin-bottom:3px;font-size:11px}
.mc-row.hdr{font-weight:600;color:var(--blue);font-size:10px;text-transform:uppercase;margin-bottom:6px;border-bottom:1px solid var(--border);padding-bottom:4px}
.mc-row input{text-align:center;padding:2px 4px;border:1px solid var(--border);border-radius:3px;font-size:11px;font-family:'SF Mono',Consolas,monospace}
.mc-row input:focus{outline:none;border-color:var(--blue)}
.mc-run-row{display:flex;gap:12px;align-items:center;margin-top:12px}
.mc-run-btn{background:var(--blue);color:#fff;border:none;padding:8px 24px;border-radius:4px;cursor:pointer;font-size:12px;font-weight:600}
.mc-run-btn:hover{background:#1f3f7a}
.mc-run-btn:disabled{opacity:.5;cursor:wait}
.mc-status{font-size:11px;color:var(--gray)}
.mc-sims-input{width:80px;text-align:center;padding:4px 6px;border:1px solid var(--border);border-radius:3px;font-size:12px;font-family:'SF Mono',Consolas,monospace}

/* Histogram stats overlay */
.hist-stats{font-size:10px;color:#444;margin-top:4px;line-height:1.6}
.hist-stats span{font-weight:600;color:var(--blue)}

/* Percentile table */
.pct-table{margin-top:14px}
.pct-table table{min-width:auto}
.pct-table th{font-size:9px;padding:5px 8px}
.pct-table td{font-size:11px;padding:3px 8px}

@media(max-width:1100px){.container{grid-template-columns:1fr}.sidebar{max-height:none}.ks{grid-template-columns:repeat(3,1fr)}.cg{grid-template-columns:1fr}.mc-row{grid-template-columns:1fr 1fr 1fr 1fr 1fr}}
</style>
</head>
<body>

<header>
 <div><h1>Consulting Firm — Financial Forecast</h1><div class="sub">5-Year P&L, Cashflow, Scenarios & Monte Carlo — standalone, no server required</div></div>
 <div class="hdr-btns">
  <button class="hdr-btn" onclick="resetDefaults()">Reset Defaults</button>
  <button class="hdr-btn" onclick="exportCSV()">Export CSV</button>
 </div>
</header>

<div class="container">
 <div class="sidebar" id="sidebar"></div>
 <div class="main">
  <div class="scn-bar" id="scn-bar"></div>
  <div class="ks" id="kpis"></div>
  <div class="tabs" id="tabbar">
   <div class="tab active" data-t="pnl">P&L Statement</div>
   <div class="tab" data-t="cf">Cashflow</div>
   <div class="tab" data-t="val">Valuation &amp; Returns</div>
   <div class="tab" data-t="ptr">Partner Economics</div>
   <div class="tab" data-t="ch">Charts</div>
   <div class="tab" data-t="mc" style="color:var(--purple);font-weight:600">Monte Carlo</div>
  </div>
  <div class="tc active" id="t-pnl"><div class="tw"><table id="tbl-pnl"></table></div></div>
  <div class="tc" id="t-cf"><div class="tw"><table id="tbl-cf"></table></div></div>
  <div class="tc" id="t-val"><div class="tw"><table id="tbl-val"></table></div></div>
  <div class="tc" id="t-ptr"><div class="tw"><table id="tbl-ptr"></table></div></div>
  <div class="tc" id="t-ch"><div class="cg" id="charts"></div></div>
  <div class="tc" id="t-mc">
   <div class="mc-controls" id="mc-controls"></div>
   <div id="mc-results"></div>
  </div>
 </div>
</div>

<script>
// ============================================================
// MODEL ENGINE
// ============================================================
const DEFAULTS={num_partners:220,revenue_per_partner_m:3.8,partner_growth_rate:4,rpp_target_m:4.1,num_consulting_staff:1400,gross_margin_pct:53,gross_margin_target_pct:55,operating_margin_pct:28,operating_margin_target_pct:32,partner_base_pay_k:380,market_studies_pct:50,ebitda_fixed_pct:6,valuation_multiple:6.25,structural_debt_m:100,total_shares_m:100,investment_pct_revenue:2,working_capital_days:120,dividend_yield:8,borrowing_rate:6.5,tax_rate:21};

let cur={...DEFAULTS};
let data=null;
let timer=null;
let activeScenario='Custom';

function runModel(c){
  const FY=5,DL=5;
  const pgr=c.partner_growth_rate/100,gm0=c.gross_margin_pct/100,gmT=c.gross_margin_target_pct/100;
  const om0=c.operating_margin_pct/100,omT=c.operating_margin_target_pct/100;
  const msPct=c.market_studies_pct/100,ebitdaFP=c.ebitda_fixed_pct/100;
  const invPct=c.investment_pct_revenue/100,divY=c.dividend_yield/100;
  const borrow=c.borrowing_rate/100,taxR=c.tax_rate/100,tShares=c.total_shares_m*1e6;
  const rppB=c.revenue_per_partner_m,rppI=(c.rpp_target_m-rppB)/FY;
  const gmI=(gmT-gm0)/FY,omI=(omT-om0)/FY;
  const capH=[];const yrs=[];
  for(let yr=0;yr<=FY;yr++){
    const partners=c.num_partners*Math.pow(1+pgr,yr);
    const rpp=rppB+rppI*yr,revenue=partners*rpp;
    const msRev=revenue*msPct,tsRev=revenue*(1-msPct);
    const tGM=gm0+gmI*yr,tOM=om0+omI*yr;
    const targetCoS=revenue*(1-tGM);
    const partnerBaseCost=partners*c.partner_base_pay_k/1000;
    const consultingStaff=Math.round(c.num_consulting_staff*Math.pow(1+pgr,yr));
    const consultingCost=Math.max(0,targetCoS-partnerBaseCost);
    const totalCoS=partnerBaseCost+consultingCost;
    const grossProfit=revenue-totalCoS;
    const actualGM=revenue>0?grossProfit/revenue:0;
    const totalOpex=Math.max(0,grossProfit-(revenue*tOM));
    const opProfit=grossProfit-totalOpex;
    const actualOM=revenue>0?opProfit/revenue:0;
    const ebitdaBase=revenue*ebitdaFP;
    const residual=Math.max(0,opProfit-ebitdaBase);
    const ebitda=ebitdaBase+residual/3;
    const partnerBonus=residual*2/3;
    const totalPartnerComp=partnerBaseCost+partnerBonus;
    const perPartnerComp=partners>0?totalPartnerComp/partners:0;
    const capex=revenue*invPct;capH.push(capex);
    let dep=0;for(let p=0;p<capH.length;p++){if((yr-p)<DL)dep+=capH[p]/DL}
    const interest=c.structural_debt_m*borrow;
    const preTax=ebitda-dep-interest;
    const tax=Math.max(0,preTax*taxR);const netIncome=preTax-tax;
    const ev=ebitda*c.valuation_multiple;
    const equityVal=Math.max(0,ev-c.structural_debt_m);
    const sharePrice=tShares>0?(equityVal*1e6)/tShares:0;
    const totalDiv=equityVal*divY;
    const dps=tShares>0?(totalDiv*1e6)/tShares:0;
    const wc=revenue*(c.working_capital_days/365);
    const revPC=consultingStaff>0?(revenue*1000)/consultingStaff:0;
    const leverage=partners>0?consultingStaff/partners:0;
    const implSal=consultingStaff>0?(consultingCost*1000)/consultingStaff:0;
    const cashOps=netIncome+dep;
    yrs.push({year:yr,partners,rpp,revenue,msRev,tsRev,partnerBaseCost,consultingCost,otherCoS:0,totalCoS,grossProfit,actualGM,totalOpex,opProfit,actualOM,ebitda,partnerBonus,totalPartnerComp,perPartnerComp,depreciation:dep,capex,interest,tax,netIncome,ev,equityVal,sharePrice,dps,totalDiv,wc,consultingStaff,revPerConsultant:revPC,leverage,impliedSalary:implSal,cashOps});
  }
  for(let i=0;i<yrs.length;i++){yrs[i].wcChange=i===0?0:yrs[i].wc-yrs[i-1].wc;yrs[i].fcf=yrs[i].cashOps-yrs[i].capex-yrs[i].wcChange}
  return yrs;
}

// ============================================================
// SCENARIOS
// ============================================================
const SCENARIOS={
  'Base Case':{...DEFAULTS},
  'Bull Case':{...DEFAULTS,partner_growth_rate:6,rpp_target_m:4.4,gross_margin_target_pct:57,operating_margin_target_pct:35},
  'Bear Case':{...DEFAULTS,partner_growth_rate:2,rpp_target_m:3.9,gross_margin_target_pct:53,operating_margin_target_pct:27},
  'AI Disruption':{...DEFAULTS,partner_growth_rate:2,rpp_target_m:3.5,market_studies_pct:35,gross_margin_target_pct:50,operating_margin_target_pct:25},
  'Rate Stress':{...DEFAULTS,borrowing_rate:8.5,structural_debt_m:130,partner_growth_rate:3},
};

function buildScenarioBar(){
  const bar=document.getElementById('scn-bar');
  let h='<span class="lbl">Scenario:</span>';
  for(const name of Object.keys(SCENARIOS)){
    const cls=activeScenario===name?'scn-btn active':'scn-btn';
    h+=`<button class="${cls}" data-scn="${name}">${name}</button>`;
  }
  h+=`<button class="${activeScenario==='Custom'?'scn-btn active':'scn-btn'}" data-scn="Custom" style="border-style:dashed">Custom</button>`;
  bar.innerHTML=h;
  bar.querySelectorAll('.scn-btn').forEach(b=>b.addEventListener('click',onScenarioClick));
}

function onScenarioClick(e){
  const name=e.target.dataset.scn;
  activeScenario=name;
  if(name!=='Custom'){
    cur={...SCENARIOS[name]};
    syncSidebarFromCur();
  }
  buildScenarioBar();
  recalc();
}

function syncSidebarFromCur(){
  for(const s of SECTIONS) for(const f of s.fields){
    const inp=document.getElementById('i-'+f.k);
    if(inp){inp.value=cur[f.k]}
    const g=document.getElementById('g-'+f.k);
    if(g){Math.abs(cur[f.k]-DEFAULTS[f.k])>0.001?g.classList.add('changed'):g.classList.remove('changed')}
  }
}

// ============================================================
// SIDEBAR
// ============================================================
const SECTIONS=[
  {title:"Revenue",fields:[
    {k:"num_partners",label:"Partners (Yr 0)",u:"#",step:1},
    {k:"revenue_per_partner_m",label:"Revenue / Partner",u:"$M",step:0.1},
    {k:"partner_growth_rate",label:"Partner Growth Rate",u:"%",step:0.5},
    {k:"rpp_target_m",label:"RPP Target (Yr 5)",u:"$M",step:0.1},
    {k:"num_consulting_staff",label:"Consulting Staff",u:"#",step:10},
  ]},
  {title:"Margins",fields:[
    {k:"gross_margin_pct",label:"Gross Margin (Yr 0)",u:"%",step:0.5},
    {k:"gross_margin_target_pct",label:"GM Target (Yr 5)",u:"%",step:0.5},
    {k:"operating_margin_pct",label:"Oper. Margin (Yr 0)",u:"%",step:0.5},
    {k:"operating_margin_target_pct",label:"OM Target (Yr 5)",u:"%",step:0.5},
  ]},
  {title:"Cost Structure",fields:[
    {k:"partner_base_pay_k",label:"Partner Base Pay",u:"$K",step:10},
    {k:"market_studies_pct",label:"Market Studies Mix",u:"%",step:1},
    {k:"investment_pct_revenue",label:"Investment (Capex)",u:"% rev",step:0.5},
  ]},
  {title:"EBITDA & Valuation",fields:[
    {k:"ebitda_fixed_pct",label:"EBITDA Fixed %",u:"% rev",step:0.5},
    {k:"valuation_multiple",label:"EV / EBITDA Multiple",u:"x",step:0.25},
    {k:"structural_debt_m",label:"Structural Debt",u:"$M",step:5},
    {k:"total_shares_m",label:"Total Shares",u:"M",step:1},
  ]},
  {title:"Capital & Tax",fields:[
    {k:"working_capital_days",label:"WC Days",u:"days",step:5},
    {k:"dividend_yield",label:"Dividend Yield",u:"%",step:0.5},
    {k:"borrowing_rate",label:"Borrowing Rate",u:"%",step:0.25},
    {k:"tax_rate",label:"Tax Rate",u:"%",step:1},
  ]},
];

function buildSidebar(){
  let h='';
  for(const s of SECTIONS){
    h+=`<h2>${s.title}</h2>`;
    for(const f of s.fields){
      h+=`<div class="ig" id="g-${f.k}"><label>${f.label} <span class="u">(${f.u})</span></label>
        <input type="number" id="i-${f.k}" value="${cur[f.k]}" step="${f.step}" data-k="${f.k}"></div>`;
    }
  }
  document.getElementById('sidebar').innerHTML=h;
  document.querySelectorAll('.ig input').forEach(el=>el.addEventListener('input',onInput));
}

function onInput(e){
  const k=e.target.dataset.k,v=parseFloat(e.target.value);
  if(isNaN(v))return;
  cur[k]=v;
  const g=document.getElementById('g-'+k);
  Math.abs(v-DEFAULTS[k])>0.001?g.classList.add('changed'):g.classList.remove('changed');
  activeScenario='Custom';buildScenarioBar();
  clearTimeout(timer);timer=setTimeout(recalc,200);
}

function resetDefaults(){cur={...DEFAULTS};activeScenario='Base Case';syncSidebarFromCur();buildScenarioBar();recalc()}

// ============================================================
// RECALC
// ============================================================
function recalc(){
  data=runModel(cur);
  renderKPIs();renderPnL();renderCF();renderVal();renderPtr();
  const at=document.querySelector('.tab.active')?.dataset.t;
  if(at==='ch')renderCharts();
}

// ============================================================
// FORMATTING
// ============================================================
function fM(v){return '$'+v.toFixed(1)+'M'}
function fP(v){return(v*100).toFixed(1)+'%'}
function fPr(v){return '$'+v.toFixed(2)}
function fI(v){return Math.round(v).toLocaleString()}
function fX(v){return v.toFixed(1)+'x'}
function cagr(a,b){return a>0?((Math.pow(b/a,.2)-1)*100).toFixed(1)+'%':'—'}

// ============================================================
// KPI STRIP
// ============================================================
function renderKPIs(){
  const y0=data[0],y5=data[data.length-1];
  const ks=[
    {l:'Revenue (Yr 5)',v:fM(y5.revenue),d:'CAGR '+cagr(y0.revenue,y5.revenue),up:y5.revenue>y0.revenue},
    {l:'EBITDA (Yr 5)',v:fM(y5.ebitda),d:'CAGR '+cagr(y0.ebitda,y5.ebitda),up:y5.ebitda>y0.ebitda},
    {l:'Oper. Margin (Yr 5)',v:(y5.actualOM*100).toFixed(1)+'%',d:(y5.actualOM>=y0.actualOM?'+':'')+((y5.actualOM-y0.actualOM)*100).toFixed(1)+'pp',up:y5.actualOM>=y0.actualOM},
    {l:'Share Price (Yr 5)',v:fPr(y5.sharePrice),d:'CAGR '+cagr(y0.sharePrice,y5.sharePrice),up:y5.sharePrice>y0.sharePrice},
    {l:'DPS (Yr 5)',v:fPr(y5.dps),d:y5.sharePrice>0?'Yield '+(y5.dps/y5.sharePrice*100).toFixed(1)+'%':'—',up:true},
    {l:'Free Cash Flow (Yr 5)',v:fM(y5.fcf),d:data[1]&&data[1].fcf>0?'CAGR '+cagr(data[1].fcf,y5.fcf):'—',up:y5.fcf>0},
  ];
  document.getElementById('kpis').innerHTML=ks.map(k=>`<div class="kpi"><div class="kl">${k.l}</div><div class="kv">${k.v}</div><div class="kd ${k.up?'up':'dn'}">${k.d}</div></div>`).join('');
}

// ============================================================
// TABLE BUILDER
// ============================================================
function buildTbl(id,spec){
  let h='<thead><tr><th>Metric</th>';
  for(const y of data)h+=`<th>Year ${y.year}</th>`;
  h+='<th>5Y CAGR</th></tr></thead><tbody>';
  for(const r of spec){
    if(r.sec){h+=`<tr class="sr"><td colspan="${data.length+2}">${r.sec}</td></tr>`;continue}
    const cls=[];if(r.ind)cls.push('ind');if(r.st)cls.push('st');if(r.hl)cls.push('hl');
    h+=`<tr class="${cls.join(' ')}"><td>${r.label}</td>`;
    const vals=data.map(y=>r.get(y));
    for(const v of vals){h+=`<td${v<0?' class="neg"':''}>${r.fmt(v)}</td>`}
    h+=`<td>${r.cg&&vals[0]>0&&vals[vals.length-1]>0?cagr(vals[0],vals[vals.length-1]):'—'}</td></tr>`;
  }
  h+='</tbody>';document.getElementById(id).innerHTML=h;
}

function renderPnL(){buildTbl('tbl-pnl',[
  {sec:'Revenue'},
  {label:'Partners (#)',get:y=>y.partners,fmt:fI},
  {label:'Revenue per Partner',get:y=>y.rpp,fmt:v=>'$'+v.toFixed(2)+'M'},
  {label:'Total Revenue',get:y=>y.revenue,fmt:fM,st:1,cg:1},
  {label:'Market Studies',get:y=>y.msRev,fmt:fM,ind:1},
  {label:'Transformation / Strategy',get:y=>y.tsRev,fmt:fM,ind:1},
  {sec:'Cost of Sales'},
  {label:'Partner Base Cost',get:y=>y.partnerBaseCost,fmt:fM,ind:1},
  {label:'Consulting Staff Cost',get:y=>y.consultingCost,fmt:fM,ind:1},
  {label:'Total Cost of Sales',get:y=>y.totalCoS,fmt:fM},
  {label:'Gross Profit',get:y=>y.grossProfit,fmt:fM,st:1,cg:1},
  {label:'Gross Margin',get:y=>y.actualGM,fmt:fP},
  {sec:'Operating Expenses'},

function drawChart(cv,labels,cfg){
  const ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  const W=cv.parentElement.clientWidth-24,H=185;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.scale(dpr,dpr);
  const pL=52,pR=12,pT=10,pB=22,cW=W-pL-pR,cH=H-pT-pB;
  let all=[];if(cfg.ds)for(const d of cfg.ds)all.push(...d.data);else all=cfg.data;
  let mn=Math.min(...all)*.95,mx=Math.max(...all)*1.05;if(mn===mx){mn-=1;mx+=1}
  const sY=v=>pT+cH*(1-(v-mn)/(mx-mn)),n=labels.length,bW=cW/n;
  ctx.strokeStyle='#e0e4eb';ctx.lineWidth=.5;
  for(let i=0;i<=4;i++){const yy=pT+(cH/4)*i;ctx.beginPath();ctx.moveTo(pL,yy);ctx.lineTo(W-pR,yy);ctx.stroke();ctx.fillStyle='#888';ctx.font='9px system-ui';ctx.textAlign='right';ctx.fillText((mx-(mx-mn)*(i/4)).toFixed(1),pL-4,yy+3)}
  ctx.fillStyle='#666';ctx.font='9px system-ui';ctx.textAlign='center';
  for(let i=0;i<n;i++)ctx.fillText(labels[i],pL+bW*i+bW/2,H-4);
  if(cfg.type==='bar'){for(let i=0;i<n;i++){const x=pL+bW*i+bW*.15,w=bW*.7,t=sY(cfg.data[i]),b=sY(Math.max(0,mn));ctx.fillStyle=cfg.color;ctx.globalAlpha=.85;ctx.fillRect(x,t,w,b-t);ctx.globalAlpha=1}}
  else if(cfg.type==='line'){ctx.strokeStyle=cfg.color;ctx.lineWidth=2.5;ctx.beginPath();for(let i=0;i<n;i++){const x=pL+bW*i+bW/2,y=sY(cfg.data[i]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();ctx.globalAlpha=.1;ctx.fillStyle=cfg.color;ctx.lineTo(pL+bW*(n-1)+bW/2,sY(mn));ctx.lineTo(pL+bW/2,sY(mn));ctx.fill();ctx.globalAlpha=1;for(let i=0;i<n;i++){ctx.fillStyle=cfg.color;ctx.beginPath();ctx.arc(pL+bW*i+bW/2,sY(cfg.data[i]),3.5,0,Math.PI*2);ctx.fill()}}
  else if(cfg.type==='ml'){for(const ds of cfg.ds){ctx.strokeStyle=ds.c;ctx.lineWidth=2.5;ctx.beginPath();for(let i=0;i<n;i++){const x=pL+bW*i+bW/2,y=sY(ds.data[i]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke();for(let i=0;i<n;i++){ctx.fillStyle=ds.c;ctx.beginPath();ctx.arc(pL+bW*i+bW/2,sY(ds.data[i]),3,0,Math.PI*2);ctx.fill()}}let lx=pL+4;ctx.font='9px system-ui';for(const ds of cfg.ds){ctx.fillStyle=ds.c;ctx.fillRect(lx,pT+1,10,3);ctx.fillText(ds.l,lx+14,pT+7);lx+=ctx.measureText(ds.l).width+26}}
  else if(cfg.type==='mb'){const nd=cfg.ds.length,gF=.15,sW=bW*(1-gF*2)/nd;for(let d=0;d<nd;d++){const ds=cfg.ds[d];for(let i=0;i<n;i++){const x=pL+bW*i+bW*gF+sW*d,t=sY(ds.data[i]),b=sY(Math.max(0,mn));ctx.fillStyle=ds.c;ctx.globalAlpha=.85;ctx.fillRect(x,t,sW*.9,b-t);ctx.globalAlpha=1}}let lx=pL+4;ctx.font='9px system-ui';for(const ds of cfg.ds){ctx.fillStyle=ds.c;ctx.fillRect(lx,pT+1,10,7);ctx.fillText(ds.l,lx+14,pT+9);lx+=ctx.measureText(ds.l).width+26}}
}

// Box-Muller transform for normal distribution
let _spare=null;
function randNormal(mean,std){
  if(_spare!==null){const v=_spare;_spare=null;return mean+std*v}
  let u,v,s;do{u=Math.random()*2-1;v=Math.random()*2-1;s=u*u+v*v}while(s>=1||s===0);
  const mul=Math.sqrt(-2*Math.log(s)/s);_spare=v*mul;return mean+std*u*mul;
}

// MC distribution config: key => {mean, std, min, max, label, unit}
// means/stds are in display units (% for pcts)
const MC_PARAMS={
  partner_growth_rate: {mean:4,std:2,min:-2,max:10,label:'Partner Growth Rate',unit:'%'},
  rpp_target_m:        {mean:4.1,std:0.3,min:3.2,max:5.0,label:'RPP Target (Yr 5)',unit:'$M'},

  operating_margin_target_pct:{mean:32,std:4,min:20,max:40,label:'Oper. Margin Target',unit:'%'},
  market_studies_pct:  {mean:50,std:8,min:25,max:70,label:'Market Studies Mix',unit:'%'},
  borrowing_rate:      {mean:6.5,std:1.5,min:3,max:12,label:'Borrowing Rate',unit:'%'},
  structural_debt_m:   {mean:100,std:20,min:60,max:180,label:'Structural Debt',unit:'$M'},
  tax_rate:            {mean:21,std:2,min:15,max:28,label:'Tax Rate',unit:'%'},
  working_capital_days:{mean:120,std:15,min:80,max:160,label:'Working Capital Days',unit:'days'},
};

let mcResults=null; // {revenue:[], sharePrice:[], ebitda:[], dps:[], fcf:[], perPartnerComp:[]}

function buildMCControls(){
  let h=`<h3>Monte Carlo Distribution Settings</h3>
    <p style="font-size:11px;color:var(--gray);margin-bottom:10px">Configure the normal distribution for each uncertain input. The model samples each parameter independently, clips to [min, max], and runs the full P&L for each trial.</p>
    <div class="mc-row hdr"><span>Parameter</span><span>Mean</span><span>Std Dev</span><span>Min</span><span>Max</span></div>`;
  for(const[k,p] of Object.entries(MC_PARAMS)){
    h+=`<div class="mc-row">
      <span>${p.label} <span class="u">(${p.unit})</span></span>
      <input id="mc-mean-${k}" type="number" value="${p.mean}" step="0.1">
      <input id="mc-std-${k}" type="number" value="${p.std}" step="0.1">
      <input id="mc-min-${k}" type="number" value="${p.min}" step="0.1">
      <input id="mc-max-${k}" type="number" value="${p.max}" step="0.1">
    </div>`;
  }
  h+=`<div class="mc-run-row">
    <label style="font-size:12px;font-weight:500">Simulations:</label>
    <input id="mc-n" class="mc-sims-input" type="number" value="3000" min="100" max="50000" step="500">
    <button class="mc-run-btn" id="mc-run-btn" onclick="runMC()">Run Monte Carlo</button>
    <span class="mc-status" id="mc-status"></span>
  </div>`;
  document.getElementById('mc-controls').innerHTML=h;
}

function readMCParams(){
  const params={};
  for(const k of Object.keys(MC_PARAMS)){
    params[k]={
      mean:parseFloat(document.getElementById('mc-mean-'+k).value),
      std:parseFloat(document.getElementById('mc-std-'+k).value),
      min:parseFloat(document.getElementById('mc-min-'+k).value),
      max:parseFloat(document.getElementById('mc-max-'+k).value),
    };
  }
  return params;
}

function runMC(){
  const btn=document.getElementById('mc-run-btn');
  const status=document.getElementById('mc-status');
  btn.disabled=true;status.textContent='Running...';
  // Use setTimeout to allow UI to update
  setTimeout(()=>{
    const params=readMCParams();
    const N=Math.min(50000,Math.max(100,parseInt(document.getElementById('mc-n').value)||3000));
    const metrics={revenue:[],ebitda:[],sharePrice:[],dps:[],fcf:[],perPartnerComp:[],opMargin:[],equityVal:[]};
    const inputSamples={};
    for(const k of Object.keys(params))inputSamples[k]=[];

    const t0=performance.now();
    for(let i=0;i<N;i++){
      // Sample assumptions
      const c={...cur};
      for(const[k,p] of Object.entries(params)){
        let v=randNormal(p.mean,p.std);
        v=Math.max(p.min,Math.min(p.max,v));
        if(k==='working_capital_days')v=Math.round(v);
        c[k]=v;
        inputSamples[k].push(v);
      }
      const res=runModel(c);
      const yr5=res[res.length-1];
      metrics.revenue.push(yr5.revenue);
      metrics.ebitda.push(yr5.ebitda);
      metrics.sharePrice.push(yr5.sharePrice);
      metrics.dps.push(yr5.dps);
      metrics.fcf.push(yr5.fcf);
      metrics.perPartnerComp.push(yr5.perPartnerComp);
      metrics.opMargin.push(yr5.actualOM*100);
      metrics.equityVal.push(yr5.equityVal);
    }
    const elapsed=((performance.now()-t0)/1000).toFixed(1);
    mcResults={metrics,inputSamples,N};
    status.textContent=`${N.toLocaleString()} simulations in ${elapsed}s`;
    btn.disabled=false;
    renderMCResults();
  },50);
}

function percentile(arr,p){const s=[...arr].sort((a,b)=>a-b);const i=(p/100)*(s.length-1);const lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)}
function mean(arr){return arr.reduce((a,b)=>a+b,0)/arr.length}
function stddev(arr){const m=mean(arr);return Math.sqrt(arr.reduce((a,b)=>a+(b-m)**2,0)/arr.length)}

  if(!mcResults)return;
  const{metrics,inputSamples,N}=mcResults;

        <span>P5:</span> ${spec.fmt(p5)} &nbsp;|&nbsp; <span>P25:</span> ${spec.fmt(p25)} &nbsp;|&nbsp;
        <span>Median:</span> ${spec.fmt(p50)} &nbsp;|&nbsp; <span>P75:</span> ${spec.fmt(p75)} &nbsp;|&nbsp;
        <span>P95:</span> ${spec.fmt(p95)} &nbsp;|&nbsp;
        Mean: ${spec.fmt(m)} &nbsp; StdDev: ${spec.fmt(s)}
      </div>
    </div>`;
  }
  h+=`</div>`;

  // Sensitivity (rank correlation)
  h+=`<div class="cc wide"><h3>Sensitivity Analysis — Rank Correlation to Year 5 Share Price</h3><canvas id="tornado"></canvas></div>`;

  // Percentile summary table
  h+=`<div class="pct-table"><h3 style="font-size:12px;color:var(--blue);margin-bottom:8px">Year 5 Percentile Summary</h3><div class="tw"><table id="pct-tbl"></table></div></div>`;

function drawHistogram(canvasId,data,color,fmt){
  const cv=document.getElementById(canvasId);if(!cv)return;
  const ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  const W=cv.parentElement.clientWidth-24,H=210;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.scale(dpr,dpr);

  const pL=10,pR=10,pT=8,pB=35;
  const cW=W-pL-pR,cH=H-pT-pB;
  const nBins=50;
  const mn=Math.min(...data),mx=Math.max(...data);
  const binW=(mx-mn)/nBins||1;
  const bins=new Array(nBins).fill(0);
  for(const v of data){let b=Math.floor((v-mn)/binW);if(b>=nBins)b=nBins-1;if(b<0)b=0;bins[b]++}
  const maxBin=Math.max(...bins);

  // Draw bars
  const barW=cW/nBins;
  for(let i=0;i<nBins;i++){
    const h=maxBin>0?(bins[i]/maxBin)*cH:0;
    ctx.fillStyle=color;ctx.globalAlpha=.75;
    ctx.fillRect(pL+i*barW,pT+cH-h,barW-1,h);
  }
  ctx.globalAlpha=1;

  // Normal curve overlay
  const m=mean(data),s=stddev(data);
  if(s>0){
    ctx.strokeStyle=color;ctx.lineWidth=2;ctx.beginPath();
    const peak=1/(s*Math.sqrt(2*Math.PI));
    for(let px=0;px<cW;px++){
      const v=mn+(px/cW)*(mx-mn);
      const density=(1/(s*Math.sqrt(2*Math.PI)))*Math.exp(-0.5*((v-m)/s)**2);
      const y=pT+cH-(density/peak)*cH*.9;
      px===0?ctx.moveTo(pL+px,y):ctx.lineTo(pL+px,y);
    }
    ctx.stroke();
  }

  // Percentile lines
  const p5=percentile(data,5),med=percentile(data,50),p95=percentile(data,95);
  for(const[pv,pc,lab] of [[p5,'#ED7D31','P5'],[med,'#C00000','Median'],[p95,'#ED7D31','P95']]){
    const x=pL+((pv-mn)/(mx-mn))*cW;
    ctx.strokeStyle=pc;ctx.lineWidth=1.5;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(x,pT);ctx.lineTo(x,pT+cH);ctx.stroke();ctx.setLineDash([]);
    ctx.fillStyle=pc;ctx.font='bold 9px system-ui';ctx.textAlign='center';
    ctx.fillText(lab,x,pT+cH+12);
    ctx.font='9px system-ui';ctx.fillText(fmt(pv),x,pT+cH+23);
  }

  // X-axis labels
  ctx.fillStyle='#888';ctx.font='9px system-ui';ctx.textAlign='center';
  for(let i=0;i<=4;i++){
    const v=mn+(mx-mn)*(i/4);
    const x=pL+(i/4)*cW;
    ctx.fillText(fmt(v),x,H-2);
  }
}

function drawTornado(canvasId,targetData,inputSamples){
  const cv=document.getElementById(canvasId);if(!cv)return;
  // Compute Spearman rank correlations
  const corrs=[];
  const targetRanks=rankArray(targetData);
  for(const[k,vals] of Object.entries(inputSamples)){
    const r=spearmanCorr(rankArray(vals),targetRanks);
    corrs.push({key:k,label:MC_PARAMS[k]?.label||k,corr:r});
  }
  corrs.sort((a,b)=>Math.abs(b.corr)-Math.abs(a.corr));

  const ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  const nBars=corrs.length;
  const barH=22,gap=4;
  const W=cv.parentElement.clientWidth-24,H=nBars*(barH+gap)+40;
  cv.width=W*dpr;cv.height=H*dpr;cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.scale(dpr,dpr);

  const pL=180,pR=60,cW=W-pL-pR,midX=pL+cW/2;

  // Title
  ctx.fillStyle='#888';ctx.font='9px system-ui';ctx.textAlign='center';
  ctx.fillText('Negative impact',pL+cW*0.25,12);
  ctx.fillText('Positive impact',pL+cW*0.75,12);

  // Center line
  ctx.strokeStyle='#ccc';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(midX,18);ctx.lineTo(midX,H);ctx.stroke();

  // Bars
  for(let i=0;i<nBars;i++){
    const c=corrs[i];
    const y=24+i*(barH+gap);
    const barLen=(c.corr/1)*cW/2; // scale: corr of 1 = full half width
    const clr=c.corr>=0?'#2F5496':'#C00000';
    ctx.fillStyle=clr;ctx.globalAlpha=.8;
    if(c.corr>=0){ctx.fillRect(midX,y,barLen,barH)}
    else{ctx.fillRect(midX+barLen,y,-barLen,barH)}
    ctx.globalAlpha=1;

    // Label
    ctx.fillStyle='#333';ctx.font='11px system-ui';ctx.textAlign='right';
    ctx.fillText(c.label,pL-8,y+barH/2+4);

    // Value
    ctx.fillStyle=clr;ctx.font='bold 10px system-ui';ctx.textAlign='left';
    const vx=c.corr>=0?midX+barLen+4:midX+barLen-4;
    ctx.textAlign=c.corr>=0?'left':'right';
    ctx.fillText((c.corr>=0?'+':'')+c.corr.toFixed(3),vx,y+barH/2+4);
  }

  // Axis labels
  ctx.fillStyle='#888';ctx.font='9px system-ui';ctx.textAlign='center';
  for(const v of [-1,-.5,0,.5,1]){
    const x=midX+v*cW/2;
    ctx.fillText(v.toFixed(1),x,H-2);
  }
}

function rankArray(arr){
  const indexed=arr.map((v,i)=>({v,i}));indexed.sort((a,b)=>a.v-b.v);
  const ranks=new Array(arr.length);
  for(let i=0;i<indexed.length;i++)ranks[indexed[i].i]=i;
  return ranks;
}

function spearmanCorr(r1,r2){
  const n=r1.length;
  let sum=0,sumR1=0,sumR2=0,sumR1sq=0,sumR2sq=0;
  for(let i=0;i<n;i++){sumR1+=r1[i];sumR2+=r2[i];sumR1sq+=r1[i]**2;sumR2sq+=r2[i]**2;sum+=r1[i]*r2[i]}
  const num=n*sum-sumR1*sumR2;
  const den=Math.sqrt((n*sumR1sq-sumR1**2)*(n*sumR2sq-sumR2**2));
  return den>0?num/den:0;
}

function buildPctTable(histSpecs){
  const{metrics}=mcResults;
  let h='<thead><tr><th>Metric</th><th>P5</th><th>P10</th><th>P25</th><th>Median</th><th>P75</th><th>P90</th><th>P95</th><th>Mean</th><th>Std Dev</th></tr></thead><tbody>';
  for(const spec of histSpecs){
    const d=metrics[spec.key];
    h+=`<tr><td>${spec.label}</td>`;
    for(const p of[5,10,25,50,75,90,95])h+=`<td>${spec.fmt(percentile(d,p))}</td>`;
    h+=`<td>${spec.fmt(mean(d))}</td><td>${spec.fmt(stddev(d))}</td></tr>`;
  }
  h+='</tbody>';
  document.getElementById('pct-tbl').innerHTML=h;
}

function exportCSV(){
  if(!data)return;
  const rows=[['Metric',...data.map(y=>'Year '+y.year)]];
  const add=(l,get)=>rows.push([l,...data.map(y=>get(y).toFixed(2))]);
  add('Partners',y=>y.partners);add('Revenue ($M)',y=>y.revenue);
  add('Gross Profit ($M)',y=>y.grossProfit);add('Gross Margin (%)',y=>y.actualGM*100);
  add('Operating Profit ($M)',y=>y.opProfit);add('Operating Margin (%)',y=>y.actualOM*100);
  add('EBITDA ($M)',y=>y.ebitda);add('Net Income ($M)',y=>y.netIncome);
  add('Free Cash Flow ($M)',y=>y.fcf);add('Share Price ($)',y=>y.sharePrice);
  add('DPS ($)',y=>y.dps);add('Total Dividends ($M)',y=>y.totalDiv);
  add('Per-Partner Comp ($M)',y=>y.perPartnerComp);add('Working Capital ($M)',y=>y.wc);
  const csv=rows.map(r=>r.join(',')).join('\n');
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='financial_forecast.csv';a.click();
}
